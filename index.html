<!DOCTYPE html>
<html>
<head>
    <title>Loading Form...</title>
</head>
<body>
    <p>Please allow location access to load the form...</p>

    <script>
        // 1. Replace the text below with your actual Smartsheet Form URL
        const smartsheetBaseUrl = "https://app.smartsheet.au/b/form/019f91824c207076a45dae8fff91f5b2";

        // 2. Ask the phone for GPS coordinates
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(redirectToSmartsheet, handleError);
        } else {
            alert("Geolocation is not supported by this browser. Loading standard form.");
            window.location.href = smartsheetBaseUrl;
        }

        function redirectToSmartsheet(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const gpsValue = lat + "," + lon;

            // This translates "Location (if required)" into safe web code so Smartsheet recognizes it perfectly
const finalUrl = smartsheetBaseUrl + "?Location%20%28if%20required%29=" + encodeURIComponent(gpsValue);

            // 4. Redirect the phone user to the filled form
            window.location.href = finalUrl;
        }

        function handleError(error) {
            alert("Location permission denied. Loading standard form without GPS.");
            window.location.href = smartsheetBaseUrl;
        }
    </script>
</body>
</html>
