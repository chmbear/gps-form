<!DOCTYPE html>
<html>
<head>
    <title>Loading Form...</title>
</head>
<body>
    <p>Please allow location access to load the form...</p>

    <script>
        // 1. PASTE YOUR ACTUAL FORM LINK BETWEEN THE QUOTES BELOW
        const smartsheetBaseUrl = "https://app.smartsheet.au/b/form/019f91824c207076a45dae8fff91f5b2";

        // 2. Request phone GPS coordinates
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(redirectToSmartsheet, handleError);
        } else {
            alert("Geolocation not supported. Loading standard form.");
            window.location.href = smartsheetBaseUrl;
        }

        function redirectToSmartsheet(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const gpsValue = lat + "," + lon;

            // 3. This builds the exact URL parameter structure Smartsheet expects
            const finalUrl = smartsheetBaseUrl + "?Location%20(if%20required)=" + encodeURIComponent(gpsValue);

            // 4. Send the user to the completed form
            window.location.href = finalUrl;
        }

        function handleError(error) {
            alert("Location access denied. Loading blank form.");
            window.location.href = smartsheetBaseUrl;
        }
    </script>
</body>
</html>
